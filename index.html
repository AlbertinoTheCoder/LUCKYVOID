<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0c0b11" />
    <meta
      name="description"
      content="LUCKYVOID — a free virtual casino and arcade. Play eight games with fictional VOID coins. No purchases, cash-outs, or prizes."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      .boot {
        min-height: 100vh;
        display: grid;
        place-content: center;
        text-align: center;
        background: #0c0b11;
        color: #bd8cf5;
        font: 700 18px system-ui;
        gap: 16px;
      }
      .boot-mark {
        font-size: 50px;
        animation: boot-glow 1.2s ease-in-out infinite alternate;
      }
      .boot small {
        font-size: 9px;
        letter-spacing: 3px;
        color: #8f789e;
      }
      @keyframes boot-glow {
        from {
          opacity: 0.4;
          transform: scale(0.9);
        }
        to {
          opacity: 1;
          transform: scale(1.1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-mark {
          animation: none;
        }
      }
    </style>
    <title>LUCKYVOID • Enter the extraordinary</title>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading LUCKYVOID">
        <span class="boot-mark">✦</span>LUCKYVOID<small
          >OPENING THE PLAYGROUND</small
        >
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
